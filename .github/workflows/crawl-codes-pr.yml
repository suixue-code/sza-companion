name: Crawl codes → Draft PR

# Fetches URLs listed in scripts/code-crawl-sources.json and appends new rows to
# src/data/codes.json as unverified only. Opens a Draft PR for human review.

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crawl-codes-pr
  cancel-in-progress: false

jobs:
  crawl-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run code crawl
        run: node scripts/crawl-codes.mjs --write

      - name: Install dependencies and verify build
        run: npm ci && npm run build

      - name: Create Draft Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): append crawl code candidates (unverified)'
          title: 'chore(data): code crawl — review before merge'
          body: |
            This **Draft** PR was generated by `.github/workflows/crawl-codes-pr.yml`.

            - Only **new** strings not already present in `codes.json` are appended as **`unverified`** / **`low`** confidence.
            - Existing rows are **not** removed or auto-expired.
            - Expect **false positives** (HTML/JS tokens); delete junk rows and fix rewards after testing in Roblox.

            Before merging: update `src/data/site-meta.json` review dates if you accept any change.

            See `.docs/CRAWL_CODES.md` for configuration and responsibilities.
          branch: automated/codes-crawl-${{ github.run_id }}
          delete-branch: true
          draft: true
          add-paths: |
            src/data/codes.json
